version: '3.8'

services:
  redis:
    image: redis:7.2-alpine
    container_name: redis_backend_learning
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command:
      # AppendOnly ensures data persist to disk
      - redis-server
      - -- appendonly
      - yes
      - --requirepass
      - ""

volumes:
  redis_data:
    driver: local